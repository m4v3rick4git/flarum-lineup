name: Flarum Lineup JS

on: [workflow_dispatch, push]

permissions:
  contents: read

jobs:
  run:
    uses: flarum/framework/.github/workflows/REUSABLE_frontend.yml@c1ff642cec7aba6fcf8ded6b862c99b4357a0776
    with:
      enable_bundlewatch: false
      enable_prettier: true
      enable_typescript: true

      frontend_directory: ./js
      backend_directory: .
      js_package_manager: npm
      node_version: 22

      build_script: build
      build_typings_script: ''
      format_script: format-check
      check_typings_script: typecheck
      type_coverage_script: ''

      # Built assets are committed explicitly.
      # CI must never commit generated assets.
      main_git_branch: __no_ci_autocommit__
