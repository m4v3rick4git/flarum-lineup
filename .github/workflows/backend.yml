name: Flarum Lineup PHP

on: [workflow_dispatch, push]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gd, json, mbstring, openssl, pdo_mysql, tokenizer, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Smoke tests
        run: composer test:smoke

      - name: PHPUnit unit tests
        run: |
          vendor/bin/phpunit --version
          vendor/bin/phpunit --configuration tests/phpunit.unit.xml --do-not-cache-result --fail-on-phpunit-deprecation --fail-on-warning --fail-on-empty-test-suite
